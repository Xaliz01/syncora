# Prometheus — développement local (backend Next/Nest sur la machine hôte).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: planwise
    environment: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: mongodb

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Nom du service Compose (grafana, mongodb, …)
      - source_labels: [container_label_com_docker_compose_service]
        regex: "(.+)"
        target_label: container
        replacement: "$1"
      # Sinon nom du conteneur Docker (planwise-grafana-local, …)
      - source_labels: [container, name]
        separator: ";"
        regex: "^;/?(.+)$"
        target_label: container
        replacement: "$1"
      - source_labels: [id]
        regex: "/docker/([a-f0-9]+)"
        target_label: container_id
        replacement: "$1"
      # Dernier recours : ID Docker tronqué à 12 caractères
      - source_labels: [container, container_id]
        separator: ";"
        regex: "^;(.+)$"
        target_label: container
        replacement: "$1"
      - source_labels: [container]
        regex: "^([a-f0-9]{12})[a-f0-9]+$"
        target_label: container
        replacement: "$1"
      - source_labels: [container]
        regex: "(.+)"
        action: keep

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://host.docker.internal:3000/api/health]
        labels: { service: api }
      - targets: [http://host.docker.internal:3020/api/health]
        labels: { service: planwise-worker }
      - targets: [http://host.docker.internal:3010/api/health]
        labels: { service: planwise-notifications }
      - targets: [http://host.docker.internal:5173/]
        labels: { service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Déploiement production — VM unique (OVH) + Docker Compose + Caddy.
#
# Trois processus Nest partagent l’image api :
#   api-{blue,green}  PLANWISE_PROCESS=api            :3000
#   planwise-worker           PLANWISE_PROCESS=worker         :3020
#   planwise-notifications    PLANWISE_PROCESS=notifications  :3010
#
# Seul Caddy (80/443) est exposé. MongoDB et les processus restent sur le réseau `planwise`.
#
# Usage :
#   cp deploy/.env.production.example deploy/.env.production
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production pull
#   # puis ./rolling-edge.sh (ne pas `up -d` global : démarrerait blue+green)

x-healthcheck: &tcp-healthcheck
  test:
    [
      "CMD-SHELL",
      'node -e "require(''net'').connect(Number(process.env.PORT),''127.0.0.1'').on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
    ]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 40s

x-planwise-env: &planwise-env
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
  NODE_ENV: production
  MONGO_BASE_URI: ${MONGO_BASE_URI:-mongodb://mongodb:27017}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis}
  PLATFORM_STAFF_EMAILS: ${PLATFORM_STAFF_EMAILS:-mail@benoistbabin.fr}
  PLATFORM_STAFF_EMAIL_DOMAINS: ${PLATFORM_STAFF_EMAIL_DOMAINS:-planwise.fr}
  PLATFORM_SIGNUP_ALERT_EMAIL: ${PLATFORM_SIGNUP_ALERT_EMAIL:-mail@benoistbabin.fr}
  PAPPERS_API_KEY: ${PAPPERS_API_KEY:-}
  PAPPERS_API_URL: ${PAPPERS_API_URL:-https://api.pappers.fr/v2}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://planwise.fr}
  APP_URL: ${APP_URL:-https://app.planwise.fr}
  CRISP_IDENTITY_SECRET: ${CRISP_IDENTITY_SECRET:-}
  ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_API_BASE: ${OPENAI_API_BASE:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
  STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${STRIPE_BILLING_PORTAL_CONFIGURATION_ID:-}
  STRIPE_LEGAL_MARKETING_URL: ${STRIPE_LEGAL_MARKETING_URL:-}
  STRIPE_CGV_URL: ${STRIPE_CGV_URL:-}
  STRIPE_CGU_URL: ${STRIPE_CGU_URL:-}
  STRIPE_ADDON_TEAM_SUGGESTION_PRICE_ID: ${STRIPE_ADDON_TEAM_SUGGESTION_PRICE_ID:-}
  STRIPE_ADDON_EXTRA_USERS_PRICE_ID: ${STRIPE_ADDON_EXTRA_USERS_PRICE_ID:-}
  STRIPE_ADDON_EXTRA_STORAGE_PRICE_ID: ${STRIPE_ADDON_EXTRA_STORAGE_PRICE_ID:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@planwise.fr}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Planwise <contact@planwise.fr>}
  SMTP_BCC: ${SMTP_BCC:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  DOCUMENT_STORAGE_PATH: /data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:?INTEGRATIONS_ENCRYPTION_KEY requis (64 hex)}
  PENNYLANE_API_BASE_URL: ${PENNYLANE_API_BASE_URL:-https://app.pennylane.com/api/external/v2}
  PENNYLANE_CLIENT_ID: ${PENNYLANE_CLIENT_ID:-}
  PENNYLANE_CLIENT_SECRET: ${PENNYLANE_CLIENT_SECRET:-}
  PENNYLANE_OAUTH_REDIRECT_URI: ${PENNYLANE_OAUTH_REDIRECT_URI:-}
  PENNYLANE_OAUTH_SCOPES: ${PENNYLANE_OAUTH_SCOPES:-customers:all customer_invoices:all}
  QONTO_API_BASE_URL: ${QONTO_API_BASE_URL:-https://thirdparty.qonto.com/v2}
  QONTO_CLIENT_ID: ${QONTO_CLIENT_ID:-}
  QONTO_CLIENT_SECRET: ${QONTO_CLIENT_SECRET:-}
  QONTO_OAUTH_REDIRECT_URI: ${QONTO_OAUTH_REDIRECT_URI:-}
  QONTO_OAUTH_SCOPES: ${QONTO_OAUTH_SCOPES:-organization.read offline_access client.read client.write client_invoice.read client_invoice.write}
  QONTO_STAGING_TOKEN: ${QONTO_STAGING_TOKEN:-}
  QONTO_OAUTH_AUTHORIZE_URL: ${QONTO_OAUTH_AUTHORIZE_URL:-}
  QONTO_OAUTH_TOKEN_URL: ${QONTO_OAUTH_TOKEN_URL:-}
  INVOICE_SYNC_BATCH_SIZE: ${INVOICE_SYNC_BATCH_SIZE:-200}

x-planwise-process: &planwise-process
  image: ${REGISTRY}/planwise-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  networks: [planwise]
  depends_on:
    mongodb:
      condition: service_healthy
  healthcheck: *tcp-healthcheck

x-api: &api
  <<: *planwise-process
  stop_grace_period: 25s
  environment:
    <<: *planwise-env
    PLANWISE_PROCESS: api
    PORT: "3000"
    SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}
    SWAGGER_TITLE: ${SWAGGER_TITLE:-Planwise API}
  volumes:
    - documents-data:/data/uploads

x-frontend: &frontend
  image: ${REGISTRY}/planwise-frontend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 20s
  networks: [planwise]
  environment:
    NODE_ENV: production
    PORT: "5173"
    HOSTNAME: 0.0.0.0
  healthcheck: *tcp-healthcheck

services:
  mongodb:
    image: mongo:7
    container_name: planwise-mongodb
    restart: unless-stopped
    networks: [planwise]
    command:
      - mongod
      - --bind_ip_all
      - --quiet
      - --setParameter
      - logComponentVerbosity={network:{verbosity:-1},accessControl:{verbosity:-1}}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  planwise-worker:
    <<: *planwise-process
    environment:
      <<: *planwise-env
      PLANWISE_PROCESS: worker
      PORT: "3020"

  planwise-notifications:
    <<: *planwise-process
    environment:
      <<: *planwise-env
      PLANWISE_PROCESS: notifications
      PORT: "3010"
    depends_on:
      mongodb:
        condition: service_healthy
      planwise-worker:
        condition: service_healthy

  api-blue:
    <<: *api

  api-green:
    <<: *api

  frontend-blue:
    <<: *frontend

  frontend-green:
    <<: *frontend

  caddy:
    image: caddy:2
    container_name: planwise-caddy
    restart: unless-stopped
    networks: [planwise]
    ports:
      - "80:80"
      - "443:443"
    environment:
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?MARKETING_DOMAIN requis}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN requis}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN:?BACKOFFICE_DOMAIN requis}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN requis}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN:?MONITORING_DOMAIN requis}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL requis}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  planwise:
    name: planwise

volumes:
  mongodb-data:
  documents-data:
  caddy-data:
  caddy-config:

name: CD (déploiement manuel)

# Déclenchement strictement manuel. Le job `guard` impose la branche master :
# même si on lance le workflow depuis une autre branche, le déploiement est refusé.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incrément SemVer calculé depuis le dernier tag vX.Y.Z. none = déployer le SHA, sans tag Git."
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - none
      version:
        description: "Version explicite optionnelle (ex. v1.2.0). Si renseignée, elle prime sur l'incrément."
        required: false
        default: ""

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  guard:
    name: Vérifier la branche master
    runs-on: ubuntu-latest
    steps:
      - name: Refuser hors master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Le déploiement n'est autorisé que depuis master (ref actuelle : ${{ github.ref }})."
          exit 1

  prepare:
    name: Préparer les métadonnées
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: meta
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REGISTRY="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          BUMP="${BUMP:-patch}"
          # Version explicite > incrément major/minor/patch > SHA (bump=none).
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
            IS_RELEASE="true"
          elif [ "$BUMP" = "none" ]; then
            VERSION="$SHA"
            IS_RELEASE="false"
          else
            VERSION="$(node scripts/next-version.mjs "$BUMP")"
            IS_RELEASE="true"
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            case "$VERSION" in
              v*) ;;
              *) VERSION="v${VERSION}" ;;
            esac
            if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version invalide : ${VERSION} (attendu vX.Y.Z)"
              exit 1
            fi
          fi
          TAG="$VERSION"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GIT_SHA=${{ needs.prepare.outputs.sha }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/planwise-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/planwise-${{ matrix.service }}:${{ needs.prepare.outputs.sha }}
            ${{ needs.prepare.outputs.registry }}/planwise-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: prepare
    environment: planwise-cd
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_MARKETING_HOST=${{ vars.NEXT_PUBLIC_MARKETING_HOST }}
            NEXT_PUBLIC_APP_HOST=${{ vars.NEXT_PUBLIC_APP_HOST }}
            NEXT_PUBLIC_BACKOFFICE_HOST=${{ vars.NEXT_PUBLIC_BACKOFFICE_HOST }}
            NEXT_PUBLIC_CRISP_WEBSITE_ID=${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}
            NEXT_PUBLIC_CRISP_HELPDESK_ENABLED=${{ vars.NEXT_PUBLIC_CRISP_HELPDESK_ENABLED }}
            NEXT_PUBLIC_GOOGLE_ADS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
            NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL=${{ vars.NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.prepare.outputs.version }}
            NEXT_PUBLIC_GIT_SHA=${{ needs.prepare.outputs.sha }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/planwise-frontend:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/planwise-frontend:${{ needs.prepare.outputs.sha }}
            ${{ needs.prepare.outputs.registry }}/planwise-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Déploiement SSH (OVH)
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, build-frontend]
    environment: planwise-cd
    steps:
      - uses: actions/checkout@v4
      - name: Copier les fichiers de déploiement sur la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "deploy/docker-compose.prod.yml,deploy/docker-compose.monitoring.yml,deploy/docker-compose.backup.yml,deploy/Caddyfile.template,deploy/rolling-edge.sh,deploy/recover-edge.sh,deploy/prune-planwise-images.sh,deploy/backup,deploy/monitoring,deploy/static"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
      - name: Pull & up sur la VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: REGISTRY,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH/deploy"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # IMAGE_TAG/REGISTRY surchargent les valeurs du .env.production (secrets locaux conservés sur la VM).
            export REGISTRY IMAGE_TAG
            chmod +x ./rolling-edge.sh ./recover-edge.sh ./prune-planwise-images.sh ./backup/*.sh
            # Assure le template présent (SCP) avant rolling.
            test -f Caddyfile.template

            compose() {
              docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml \
                --env-file .env.production --profile monitoring "$@"
            }

            compose pull

            # 1) Worker, notifications et monitoring. Les slots edge sont basculés ensuite.
            compose up -d \
              mongodb \
              planwise-worker planwise-notifications \
              prometheus tempo otel-collector grafana loki alloy node-exporter cadvisor blackbox-exporter mongodb-exporter

            # Recharge la config Prometheus (bind-mount) sans recréer le volume TSDB.
            docker exec planwise-prometheus wget -qO- --post-data='' http://localhost:9090/-/reload >/dev/null \
              || docker restart planwise-prometheus || true

            # 2) Bascule blue/green : api et frontend ensemble, sur le slot opposé au slot publié.
            ./rolling-edge.sh

            # 3) Caddy : rolling-edge a déjà écrit Caddyfile (slot actif unique).
            #    Recreate pour être sûr que le process charge le fichier disque.
            echo "=== Recreate Caddy ==="
            if grep -E '__FRONTEND_UPSTREAM__|health_uri|frontend-blue:5173 frontend-green' Caddyfile; then
              echo "❌ Caddyfile invalide après rolling-edge (placeholders / multi-upstream / health_uri)"
              exit 1
            fi
            compose stop caddy || true
            compose rm -f caddy || true
            compose up -d --no-deps caddy
            sleep 2
            echo "Caddy recréé OK"

            # 4) Purge des orphelins (anciens noms api / frontend) une fois
            #    blue (ou green) + Caddy en place.
            compose up -d --remove-orphans \
              caddy \
              mongodb \
              planwise-worker planwise-notifications \
              prometheus tempo otel-collector grafana loki alloy node-exporter cadvisor blackbox-exporter mongodb-exporter

            # Smoke : au moins un slot frontend / gateway doit répondre en local.
            fe_ok=0
            for slot in frontend-blue frontend-green; do
              id="$(compose ps -q --status running "$slot" 2>/dev/null || true)"
              if [[ -n "$id" ]]; then
                if docker exec "$id" node -e "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))" 2>/dev/null; then
                  fe_ok=1
                  break
                fi
              fi
            done
            if [[ "$fe_ok" -ne 1 ]]; then
              echo "❌ Aucun frontend slot ne répond après deploy"
              compose ps || true
              compose logs --tail 100 frontend-blue frontend-green caddy || true
              exit 1
            fi

            # Persister le tag déployé : un `compose up` manuel sans export IMAGE_TAG
            # ne doit pas recréer l'app avec un ancien tag du .env.production.
            # Avant écrasement : mémoriser le tag précédent pour le prune (rollback).
            PREVIOUS_IMAGE_TAG=""
            if grep -q '^IMAGE_TAG=' .env.production; then
              PREVIOUS_IMAGE_TAG="$(grep '^IMAGE_TAG=' .env.production | head -1 | cut -d= -f2- | tr -d '[:space:]')"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env.production
            else
              printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env.production
            fi
            if [[ -n "$PREVIOUS_IMAGE_TAG" && "$PREVIOUS_IMAGE_TAG" != "$IMAGE_TAG" ]]; then
              printf '%s\n' "$PREVIOUS_IMAGE_TAG" >.previous-image-tag
            fi
            if grep -q '^REGISTRY=' .env.production; then
              sed -i "s|^REGISTRY=.*|REGISTRY=${REGISTRY}|" .env.production
            else
              printf 'REGISTRY=%s\n' "$REGISTRY" >> .env.production
            fi
            # Ne conserve que les images Planwise de la MEP courante + précédente.
            # (tags exacts IMAGE_TAG / PREVIOUS ; conteneurs stoppés orphelins retirés
            # avant rmi pour ne pas bloquer le clean.)
            export PREVIOUS_IMAGE_TAG
            echo "Prune Planwise : IMAGE_TAG=${IMAGE_TAG} PREVIOUS_IMAGE_TAG=${PREVIOUS_IMAGE_TAG:-<none>}"
            ./prune-planwise-images.sh
            docker logout ghcr.io

  tag:
    name: Taguer la release Git
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    # Seulement si une version explicite a été fournie (pas de tag pour un déploiement SHA).
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Créer et pousser le tag (idempotent)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Le tag $VERSION existe déjà sur origin, rien à faire."
            exit 0
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Tag $VERSION créé et poussé sur le commit ${{ needs.prepare.outputs.sha }}."
